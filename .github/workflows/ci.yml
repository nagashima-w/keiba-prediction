# 型検査・テストの関門(Issue #248。#287 で app のビルドを外した)。
#
# ★何のためのワークフローか:
#   exe 版をアーカイブし、exe のビルドと dev-latest への公開を止めた(Issue #248。最後の exe は dev-latest にある 1.44.0)。
#   それまで、ルートの `pnpm typecheck` と `pnpm test`(packages/core・scripts/ のテスト)を CI で走らせていたのは
#   旧 build-windows.yml だけだった。deploy-cloud.yml の check ジョブは cloud/ のテストしか走らせない。
#   しかし cloud は packages/core のソースを相対 import しており、承認印のゲートの検査(scripts/test)も
#   ルートの `pnpm test` でしか走らない。そのため、exe の公開だけを外して「テストの関門」を残したのが本ワークフローである。
#   **ここは公開しない。** リリースへの書き込み・タグでの起動・秘密の参照は持たない(scripts/test/ci-workflow.test.ts が固定している)。
#
# ★本番デプロイとは独立: 本番へのデプロイの関門(承認印 `[PUBLISH-APPROVED]` と「レビュー継続中」)は deploy-cloud.yml にあり、
#   このワークフローは承認印の有無に関わらず作業ブランチへの push のたび(と、作業ブランチ宛ての PR。Issue #310)に走る。cloud-verify ジョブだけは PR のときだけ走る(下のジョブのコメント)。デプロイはこのワークフローの結果を待たない
#   (needs はワークフロー間では張れない)。承認印付きの push の後は、本ワークフローの成否と、deploy-cloud.yml の
#   deploy ジョブが実際に走ったことの両方を確かめる(CLAUDE.md「報告と承認の方針」)。
#
# ★ubuntu-latest で動かす理由: ローカル(Linux/LF)と同じ環境になり、改行コード(CRLF)・シェルの差(pwsh)による
#   「ローカルは緑・CI で落ちる」事故が構造的に消える。web(Cloudflare Worker)に Windows 固有の要素は無い。
#
# ★app のビルド(`pnpm --filter @keiba/app build`)を外した理由(Issue #287。packages/app を削除した):
#   以前は、web のクライアントが import する renderer のモジュール(例 renderer/format.ts)に node 組込みの名前付き import
#   (`import { gzipSync } from "node:zlib"` と、その呼び出し)を混入させたとき、vitest・型検査では検出できないので、app のビルドが
#   その関門を担っていた。いまは共有部分が packages/core/src/view/・analysis/ にあり、同じ混入を検出するのは、deploy-cloud.yml の check ジョブの
#   cloud の型検査(`pnpm run typecheck`。tsconfig.client.json が Node の型を持たない)と、cloud のテスト(`pnpm test`)に含まれる
#   test/client-bundle.test.ts・test/import-guard.test.ts である(Issue #287 で、混入の実験をして確かめた)。
#   Issue #288 で deploy-cloud.yml のスモークを別ジョブ(smoke)に分けたが、型検査とテストは check ジョブに残っている
#   (scripts/test/ci-workflow.test.ts が、check が cloud の型検査とテストを無条件で走らせていることを固定している)。
#
# ★`pnpm test` は、確率の質の測定のテスト(ルートの scripts/test/probability-quality-41-*.test.ts と packages/core の確率の質のテスト 3 ファイル)を含まない(Issue #395)。
#   それらは `pnpm test:research` と、手動実行のワークフロー research.yml で流す。型検査(`pnpm typecheck`)は外していないので、外したテストの型はここで検査される。
#   確率の質のコード(packages/core/src/ev/probability-quality*.ts・scripts/probability-quality-41*/)に触れる変更は、`pnpm test:research` も走らせて確かめる。
#
# ★uses: はコミット SHA でピン留めしている(Issue #305)。タグは付け替えで中身が差し替わりうるため、行末のコメントに版数を書く。
#   SHA は `git ls-remote https://github.com/<owner>/<repo>` の実出力から取った、ピン留めの時点でタグが指していたコミット(CI が動かすコードは変えていない)。
#   タグが最新の版を指していないことがあるので、行末の版数は、SHA が指す版を確かめて書く(特定の action・版の説明は、Dependabot の更新で古くなるので、ここには書かない)。
#   版の更新は Dependabot(.github/dependabot.yml)の PR が、SHA と行末の版数コメントを同時に書き換える。scripts/test/actions-pinned.test.ts は
#   特定の SHA・版数ではなく規則を検査する(全 uses が SHA 固定 + `# vX.Y.Z`・全ワークフローで同じ action は同じ SHA と版数・許可リスト内の action だけ)ので、
#   PR をそのままマージしても緑のままである。手で上げるときも、全 uses 行(ci.yml・deploy-cloud.yml)を揃えて直せばよい(食い違いはテストが検出する)。
#   新しい action を使うときは、テストの許可リスト(ALLOWED_ACTIONS)に意図して足す。
name: 型検査・テストの関門

on:
  push:
    branches:
      - claude/issue-order-processing-wjgpdd
  # 作業ブランチ宛ての PR(Dependabot の更新 PR。Issue #310)でも関門を走らせる。pull_request_target ではない(PR のコードを秘密のある状態で動かさない)。
  # このワークフローは秘密を参照せず、権限は contents: read だけなので、PR の側が書き換えても得られるものは無い。
  pull_request:
    branches:
      - claude/issue-order-processing-wjgpdd
  workflow_dispatch:

# リポジトリへは何も書き戻さない。
permissions:
  contents: read

# 同一ブランチの多重実行では、古い run を取り消す(テストだけで、公開しないので取り消してよい)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm はバージョン未指定にして package.json の packageManager フィールド(pnpm@10.33.0)に従わせる。
      - name: pnpm をセットアップ
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node.js をセットアップ
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: 依存をインストール
        run: pnpm install --frozen-lockfile

      # ルートの `pnpm typecheck`(= `pnpm -r typecheck && tsc -p tsconfig.scripts.json`)。
      # `pnpm -r typecheck` だけでは scripts/ の型検査(tsconfig.scripts.json)が走らない(Issue #38)。
      - name: 型検査を実行
        run: pnpm typecheck

      # ルートの `pnpm test`(= `pnpm -r test && vitest run`)。`pnpm -r test` のままだと scripts/ のテストが CI で実行されない。
      - name: テストを実行
        run: pnpm test

  # Issue #310: Dependabot の PR(pull_request)のときだけ走る、cloud/ の検査。cloud の依存(wrangler・esbuild・sdk 等)の PR は
  # ルートの検査(上の verify)では cloud の型検査・テスト・スモークが走らないので、PR の段階で赤を知るために足した。
  # push では走らない: 作業ブランチへの push では deploy-cloud.yml の check・smoke が同じ検査をするので、重複させない。
  # 手順は deploy-cloud.yml の check・smoke ジョブと同じ形(同じ SHA の actions)。秘密は使わない(スモークは外部へ出ない)。
  # dry-run と D1 の migration は、cloud の依存の PR で壊れうるが、重複を抑えるため含めない(マージ後の push の check ジョブが走らせる)。
  cloud-verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node.js をセットアップ
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cloud/pnpm-lock.yaml

      # cloud/ は pnpm workspace の外。ロックファイルで固定し、独立にインストールする。
      - name: 依存をインストール(cloud)
        working-directory: cloud
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: 型検査(cloud)
        working-directory: cloud
        run: pnpm run typecheck

      - name: テスト(cloud)
        working-directory: cloud
        run: pnpm test

      - name: ローカルスモークテスト(cloud)
        working-directory: cloud
        run: pnpm run smoke
