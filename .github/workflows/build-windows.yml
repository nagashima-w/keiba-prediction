# Windows 向け exe を electron-builder でビルドし、Releases にローリング公開するワークフロー。
#
# 方針(ユーザー指示):
#   UI 実装中は常に Releases から最新 exe をダウンロードできる状態を維持する。
#   そのため固定タグ `dev-latest` のプレリリースを、公開ゲート(下記 PUBLISH_DEV_LATEST。Issue #43)を
#   満たす push のたびに in-place で差し替える(ローリングプレリリース。delete→create ではなく
#   既存アセットの上書き更新。詳細は後段の公開ステップのコメントを参照)。
name: Windows ビルドと Releases 公開

on:
  # 開発ブランチへの push ではビルド・テストを毎回実行し、公開ゲート(下記 PUBLISH_DEV_LATEST)を
  # 満たす push のときだけ dev-latest プレリリースを差し替える(ビルドの実行可否と公開可否は別)。
  push:
    branches:
      - claude/keiba-ev-tool-dev-cvagiu
      - claude/handover-next-session-x5ki6o
      - claude/keiba-prediction-handover-ojr8t1
      - claude/issue-order-processing-wjgpdd
    # v* タグ(例 v1.0.0)の push で正式リリースをビルド・公開する。
    tags:
      - "v*"
  # 手動実行も可能にする。
  workflow_dispatch:

# Releases(タグ/リリース)へ書き込むための権限を明示的に付与する。
permissions:
  contents: write

# 同一ワークフローの多重実行を抑止し、走行中の古いビルドはキャンセルする。
# ref 単位でグループ化し、タグ(正式リリース)ビルドとブランチ(dev-latest)ビルドが
# 互いをキャンセルしないようにする。
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows ネイティブの exe を作るため windows-latest 上でビルドする。
    runs-on: windows-latest
    env:
      # PUBLISH_DEV_LATEST: dev-latest への公開可否をここで一元判定する。
      # 公開ステップ・孤児掃除ステップ・スキップ通知ステップは必ずこの値だけを参照し、
      # 条件式を2箇所以上に複製してはならない(複製した2つがずれると「公開せずに掃除だけ実行」に
      # なり、dev-latest の exe が全滅する。掃除ステップは現行ビルド成果物以外の .exe を
      # 無条件に削除するため)。
      #
      # Issue #43(既定値の反転): 旧仕様は「コミットメッセージに『レビュー継続中』が無ければ公開する」
      # という「既定で公開」の設計だった。これは印の無い自動コミットが1つ割り込むだけで
      # 未レビューのコードが公開される事故を招いた(コミット 10a4c54 が印なしで単独 push され、
      # その時点でブランチには boss 承認前の実装が4コミット載っていた。実害は無かったが、
      # 実装が packages/app/src に触れていれば未承認コードが配布されていた)。
      # push という操作自体がこちらの手を離れて(自動コミット等から)起こりうる以上、防御は
      # CI 側に置くしかなく、既定値は安全側(既定で非公開)でなければならない。そのため本タスクで
      # 「承認印([PUBLISH-APPROVED])付きの push」を公開の必須条件に変更し、既定を反転した。
      #
      # 現行の判定(公開する3条件のいずれか):
      # 1. ブランチ ref への workflow_dispatch(手動実行)。
      #    付け忘れ・機械判定の誤りからの回復レバーとして無条件公開を維持する。明示的な人手操作
      #    であり、事故原因である「無言の既定動作」とは性質が違う。
      # 2. ブランチ ref への push で、先端コミットメッセージに承認印 `[PUBLISH-APPROVED]` を含み、
      #    かつ「レビュー継続中」を含まない。
      #    event_name == 'push' を明示するのは、workflow_dispatch では head_commit が null になる
      #    ため、暗黙の型強制(null への contains 呼び出し)に手動実行時の挙動を委ねず、
      #    「手動実行では条件1が別途無条件で担当する」意図を式として明示するため。
      # (それ以外: v* タグ push・タグ ref への手動実行・head_commit が null のその他イベントは
      #  常に false。startsWith(github.ref, 'refs/heads/') がブランチ ref 以外をすべて落とす)
      #
      # 承認印リテラルの運用: `[PUBLISH-APPROVED]` はコミットメッセージの**件名(1行目)の末尾**に
      # 置く運用とする(CLAUDE.md「レビュー継続中の中間コミット」節)。ただし `contains()` は
      # コミットメッセージ全文(件名+本文)を対象にするため、本文中に書いても実際には効いてしまう
      # ——CI の判定基準(全文)と運用上の置き場所(件名末尾)がずれているという残存ギャップとして
      # ここに明記する。
      #
      # 「レビュー継続中」の否定(AND)は保険として残す: 承認印リテラルが偶然の一致や引用
      # (例: このコメント自体の引用、無関係な文脈での言及)で本文に混入した場合の二重の防波堤。
      # ただし公開を許可する側の荷重を担うのは承認印(contains 側)であり、この否定は
      # もはや主たる防御ではなく保険にすぎない。
      #
      # 残存リスク(大文字小文字): GitHub Actions の式の文字列比較(contains 含む)は
      # 大文字小文字を区別しない。そのため `[publish-approved]` のような小文字表記も一致する。
      # 広い側の一致が効くのは公開を許可する側であるため、意図しない大小文字違いの文字列でも
      # 公開されうる残存リスクとして明記する。
      #
      # 残存ギャップ(複数コミットの push): 1回の push に複数コミットが含まれる場合の判定は
      # head_commit(push後のref先端のコミット = 実際にビルドされるツリーそのもの)のみで行う。
      # 先端コミットのメッセージに承認印が無ければ、同じ push 内の祖先コミットに承認印があっても
      # 公開されない(fail-safe 側の挙動であり、Issue #43 が問題視した「印なしで公開される」方向の
      # 事故ではない)。
      PUBLISH_DEV_LATEST: ${{ startsWith(github.ref, 'refs/heads/') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[PUBLISH-APPROVED]') && !contains(github.event.head_commit.message, 'レビュー継続中'))) }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      # pnpm はバージョン未指定にして package.json の packageManager フィールド(pnpm@10.33.0)に従わせる。
      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 依存をインストール
        run: pnpm install --frozen-lockfile

      # Issue #45(D-2): #44-D-1(docs/versioning.md)の版数運用規約「正式版タグは
      # v<package.json の version>」を機械検査する。v* タグ push・タグ ref への
      # workflow_dispatch でのみ実行する(正式リリースステップと同一の if:)。
      # build 成果物を必要とせず packages/app/package.json の version だけで判定できるため、
      # 型検査・テスト・ビルドより前の早期失敗位置に置く。
      # 判定核は scripts/release-gate.ts の純関数(judgeTagVersion)。インライン bash で
      # 書くと、テストは yml のテキストへの正規表現しか書けず判定ロジック自体は1行も
      # 実行されないまま「テストがある体」になる(#43 で実際に起きた形骸化の再来)ため、
      # scripts/test/release-gate.test.ts で実ふるまいを検証できる形にしている。
      # fail-closed: packages/app/package.json が読めない/不正な場合も block する
      # (この入力はローカルで決定的に定まる値であり、version-bump-check〈下記〉のような
      # リモート API の一過性障害が原理的に起こり得ないため。詳細は release-gate.ts 冒頭)。
      - name: タグとバージョンの一致を検証
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          # git のタグ名は空白こそ使えないが " ; $ ` ( ) は使用可能で、run: の script 文字列に
          # ${{ github.ref_name }} を直接展開するとシェル注入・引用崩れが原理的に成立する
          # (push 権限が要るため現実の脅威度は低いが、下記の孤児掃除ステップの CURRENT_EXE と
          # 同じ理由で対策する: 値を env 変数として渡し、run: 側では $VAR 参照に留める)。
          TAG_NAME: ${{ github.ref_name }}
        run: pnpm exec tsx scripts/release-gate.ts tag-version "$TAG_NAME"

      # 型検査をテスト・ビルドより前段の関門にする(fail fast。Issue #38)。
      # ルートの `pnpm typecheck`(= `pnpm -r typecheck && tsc -p tsconfig.scripts.json`)を呼ぶ。
      # `pnpm -r typecheck` だけでは scripts/ の型検査(tsconfig.scripts.json)が走らない。
      - name: 型検査を実行
        run: pnpm typecheck

      # 全パッケージ(core + app)+ ルート(scripts/)のテストが通ることをビルド前の関門にする。
      # ルートの `pnpm test`(= `pnpm -r test && vitest run`)で scripts/ のテストも対象に含める
      # (`pnpm -r test` のままだと scripts/ のテストは CI で実行されない)。
      - name: テストを実行
        run: pnpm test

      # renderer(Vite)+ main/preload(esbuild)をビルドする。
      - name: app をビルド
        run: pnpm --filter @keiba/app build

      # electron-builder で portable exe を生成する。
      # better-sqlite3(ネイティブ)は electron-builder が Electron 向けに rebuild して同梱する。
      # electron-builder 自身の自動公開は無効化(--publish never)し、公開は後段の action-gh-release に一本化する。
      - name: electron-builder で exe を生成
        run: pnpm --filter @keiba/app exec electron-builder --win --config electron-builder.yml --publish never

      # Issue #62: 配布 exe が「動くこと」を CI で検査するゲート(2ステップ、常時関門・if:なし)。
      #
      # 背景: #60(better-sqlite3 が packaged 実行でロードできなかった実機事故)を #61 で
      # 是正したが、このリポジトリの検証は「exe が更新されたこと」しか見ておらず「exe が
      # 動くこと」を一度も確認していなかった。vitest は Node 環境で走るため、Electron
      # ランタイム・asar・ネイティブモジュールの破綻を原理的に検出できない。
      #
      # 2段構成にした理由(boss の着手前ゲートで実測により確定): 壊れていた v1.3.1 の実物 exe を
      # 検査すると asar 配置検査4項目(当初案)すべてが PASS した一方、ヘッドレススモークは
      # ABI 不一致(NODE_MODULE_VERSION 不一致)で実際に FAIL した。配置検査だけでは ABI
      # 不一致を1件も検出できないため、下記2ステップ目(ヘッドレススモーク)が本命であり、
      # 1ステップ目(asar配置検査)はスモークが検出できない構造面(A1/A2)だけを補完する縮小版。
      #
      # 判定核はすべて scripts/artifact-gate.ts の純関数(release-gate.ts と同じ考え方)。
      # yml へインライン bash の判定ロジックを書かない(#43 の形骸化の再来を避ける)。
      #
      # 射程外(#60型の症状を検出できない、とは書かない。#61以降それは事実として誤り):
      # 1. 検査対象は win-unpacked であり、portable exe 自身の自己展開(%TEMP%への展開)は通らない
      # 2. ELECTRON_RUN_AS_NODE=1 は Electron の Node 部分だけを起動する。Chromium 初期化・
      #    app.whenReady・BrowserWindow・preload・renderer は動かないため、GUI起動時にしか
      #    出ない破綻は検出しない
      # 3. 本番の呼び出し元(main.cjs の ResourceManager 経由)そのものは実行しない。ただし
      #    #61 以降 nativeBinding を明示指定するため bindings のスタック走査は使われず、
      #    .node の実 require は database.js が絶対パスで行う。呼び出し元の違いは .node の
      #    ロード可否に影響しない
      # 4. DB操作は CREATE TABLE/INSERT/SELECT のみで、スキーマ移行経路は通らない
      # 5. ビルドマシン上のx64成果物のみ。ユーザー実機の環境差(VC++ランタイム・AVの隔離・
      #    %TEMP%の残骸)は対象外
      # 6. スモークの実 exe 経路は Linux では原理的に実行できない(resolveSingleWinUnpackedExe が
      #    `.exe` を要求するが、Linux 成果物の実行ファイルは `.exe` 拡張子を持たない)。ローカルで
      #    通せるのは fake deps までで、実経路(実 exe を spawn して better-sqlite3 をロードする経路)
      #    の検証は Windows CI が唯一の場所である
      - name: 配布 exe の asar 配置を検査(A1/A2)
        run: pnpm exec tsx scripts/artifact-gate.ts asar-layout

      - name: 配布 exe のヘッドレススモークテスト
        run: pnpm exec tsx scripts/artifact-gate.ts smoke

      # Issue #45(D-2): #44-D-1(docs/versioning.md)の版数運用規約「公開1回につき必ず1回
      # 版数を上げる」を機械検査する。今回ビルドした exe と同名のアセットが dev-latest に
      # 既に存在する(= 版数が据え置かれたまま公開されようとしている)場合に block する。
      - name: 版数据え置きを検査(dev-latest 公開前)
        if: env.PUBLISH_DEV_LATEST == 'true' && github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/release-gate.ts version-bump-check
      # if: env.PUBLISH_DEV_LATEST == 'true' && github.event_name == 'push' は唯一解
      # (boss 着手前ゲート(C)): env: マップ内から別の env は参照できないため、
      # PUBLISH_DEV_LATEST の判定式をここへ複製することはできない(条件式を2箇所以上に
      # 複製しない規律への抵触)。PUBLISH_DEV_LATEST(ブランチ ref かつ(手動実行 or
      # 承認印付き push))に event_name == 'push' の絞り込みを掛け合わせるだけで、
      # 「承認印付き push だけ」に一致し workflow_dispatch(同一コミット再送。
      # docs/versioning.md が版数据え置き検査から除外すると予告している)を自然に除外する。
      #
      # continue-on-error は付けない(実装仕様2): block(exit 1)した場合、このステップに
      # 続く公開・掃除ステップは GitHub Actions の「if: にステータス関数を含まない場合は
      # 暗黙に success() が付く」という仕様により自動的にスキップされる。この仕様依存は
      # GitHub Actions 側の挙動でありテストでは検証できない(AC9。静的な yml テキスト検査に
      # 留まる本テストスイートの限界)。**block 経路(実際に据え置きで exit 1 になる CI run)
      # は本タスクでは実物未検証**であり、担保は scripts/test/release-gate.test.ts の
      # ふるまいテストとミューテーションテストに委ねている。
      #
      # fail-open: dev-latest のアセット一覧取得(GitHub REST API)に失敗しても公開自体は
      # 止めない(allow + warning。404/403/5xx/ネットワーク例外は文言で区別してログに残す。
      # 詳細は scripts/release-gate.ts 冒頭)。version-bump-check(この検査)の入力は
      # リモート API 呼び出しを要し一過性障害があり得るため、tag-version(上記)とは非対称に
      # fail-open を選んでいる。

      # ブランチ push / 手動実行時: 生成した exe を dev-latest プレリリースとして公開する。
      # 既存の dev-latest を delete→create せず、action-gh-release の in-place 更新で差し替える
      # (delete 方式だと公開失敗時に dev-latest が消えたまま残る非アトミック性があるため)。
      # 同名アセット(keiba-ev-tool-<version>-portable.exe)は上書き設定で置き換える。
      - name: Releases に公開(dev-latest を in-place 更新 / ブランチ push 時)
        # 公開可否はジョブ env の PUBLISH_DEV_LATEST に一元化(孤児掃除ステップと必ず同じ値を参照する)。
        if: env.PUBLISH_DEV_LATEST == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: 開発版(最新ビルド)
          prerelease: true
          # artifactName はバージョン固定(keiba-ev-tool-<version>-portable.exe)のため、
          # action-gh-release が同名の既存アセットを上書きし、in-place で最新 exe に差し替わる。
          body: |
            開発ブランチの最新コミットから自動ビルドした開発版です。
            最新の実装を試せますが予告なく内容が変わります(個人利用専用)。
            安定して使う場合は最新の正式版(v*)を入手してください。
          files: packages/app/release/*.exe

      # dev-latest に残った孤児 exe アセットを掃除する(ブランチ push 時のみ)。
      # 背景: artifactName がバージョン依存(keiba-ev-tool-<version>-portable.exe)のため、
      # softprops/action-gh-release の in-place 上書きは「同名」のアセットしか差し替えない。
      # version を上げると旧バージョン名のアセットが dev-latest に残置され続けてしまう。
      # このステップは直前の公開ステップの後に置くことで、最新 exe が必ず先にアップロード
      # 済みの状態を保ったまま(atomicity を壊さず)、現行ファイル名以外の .exe だけを削除する。
      # 現行ファイル名は version の再パースではなく、ビルド成果物 packages/app/release/*.exe の
      # basename から直接導出する(名前解決の曖昧さを排除するため)。
      # 前提: portable ターゲットのみ設定のため exe は常に1個生成される。将来 target を追加して
      # exe が複数生成される設定に変えた場合は、件数ガード(下記 exe_count チェック)で検知して
      # 掃除をスキップする(basename の suffix 誤解釈による静かな誤動作を避けるため)。
      # 既知の制約: concurrency グループは github.ref 単位のため、複数開発ブランチが同時 push
      # されると本ステップが並行実行されうる。その場合、一覧取得→削除の間に他 run が直後に
      # アップロードした exe を孤児と誤判定して削除する競合ウィンドウが理論上ある(本ステップの
      # スコープ外の構造的リスクとして許容する)。
      - name: dev-latest の孤児 exe アセットを掃除(現行ファイル名以外を削除)
        # 公開ステップと必ず同じ値(ジョブ env の PUBLISH_DEV_LATEST)を参照する。ここだけ条件式を
        # 書き換えてずらすと、公開されないまま掃除だけ走り dev-latest の exe が全滅する。
        if: env.PUBLISH_DEV_LATEST == 'true'
        shell: bash
        # このステップは前段で exe 本体のアップロードが完了した後の後片付けであり、
        # 失敗してもビルド・公開自体は成功させたい(受け入れ条件: run が conclusion=success)。
        # ただし全面 `|| true` で無言に握りつぶすのではなく、個別の失敗は
        # ::warning:: で必ずログに残し、次回実行時に再試行される形にする。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # exe が想定通り1個だけ生成されているかを機械的に検査する。
          # basename はマッチが複数でもエラーにならず第2引数を suffix 解釈して静かに誤動作するため、
          # コメントだけの前提依存にせず、件数を明示的にガードする。
          exe_count=$(ls packages/app/release/*.exe 2>/dev/null | wc -l | tr -d ' ')
          if [ "$exe_count" != "1" ]; then
            echo "::warning::release ディレクトリの .exe が1個ではありません(${exe_count}個)。孤児掃除をスキップします(target 追加等で前提が変わった可能性)"
            exit 0
          fi

          export CURRENT_EXE=$(basename packages/app/release/*.exe)
          echo "現行ファイル: $CURRENT_EXE"

          # gh 内蔵 jq は --arg 未対応のため、env.CURRENT_EXE 経由でシェル変数を jq に渡す。
          # 取得コマンド自体の失敗(ネットワーク瞬断・レート制限等)を「孤児なし」と取り違えないよう、
          # 失敗時は ORPHANS を明示的に空にした上で ::warning:: を出す(取得失敗と本当に孤児が
          # 0件であるケースを区別する)。
          if ! ORPHANS=$(gh release view dev-latest --json assets \
            --jq '.assets[].name | select(endswith(".exe") and . != env.CURRENT_EXE)'); then
            echo "::warning::dev-latest のアセット一覧取得に失敗しました。孤児掃除をスキップします(次回のビルドで再試行されます)"
            ORPHANS=""
            SKIP_CLEANUP=1
          fi

          if [ -n "${SKIP_CLEANUP:-}" ]; then
            : # 一覧取得失敗時は上で警告済みのため何もしない
          elif [ -z "$ORPHANS" ]; then
            echo "孤児 exe アセットなし"
          else
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              echo "削除対象: $asset"
              if ! gh release delete-asset dev-latest "$asset" --yes; then
                echo "::warning::孤児アセット削除に失敗しました: $asset(次回のビルドで再試行されます)"
              fi
            done <<< "$ORPHANS"
          fi

      # ゲート条件でスキップした場合に理由をログへ残す(無言スキップは不可)。
      # 条件をブランチ push / ブランチへの手動実行に限定するのは、v* タグ push や
      # タグ ref への手動実行では PUBLISH_DEV_LATEST が(承認印の有無とは無関係の理由で)常に
      # false になり、そのまま逆条件にすると「承認印が無いためスキップした」という事実と異なる
      # notice を出してしまうため(dev-latest 公開はそもそもブランチ push 専用の仕組みであり、
      # タグ push には無関係)。
      # always() は付けない: 前段(テスト・ビルド・パッケージング等)が失敗した場合、暗黙の
      # success() によりこのステップもスキップされる。always() を付けると、ビルド失敗を
      # 「承認印なしスキップ」と誤って名乗ってしまう事故になる。
      - name: dev-latest 公開スキップをログに記録(承認印なしコミット時)
        if: startsWith(github.ref, 'refs/heads/') && env.PUBLISH_DEV_LATEST != 'true'
        run: |
          echo "::notice::コミットメッセージに承認印『[PUBLISH-APPROVED]』が無い、または『レビュー継続中』が含まれるため、dev-latest への公開と孤児 exe 掃除をスキップしました(承認印付きコミットを push するか、workflow_dispatch で公開できます)"

      # v* タグ push 時: そのタグの正式リリース(プレリリースではない)を作成する。
      # tag_name を指定しなければ、トリガーとなったタグ(github.ref)がそのまま使われる。
      - name: Releases に公開(正式リリース / v* タグ push 時)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          body: |
            競馬期待値分析ツール ${{ github.ref_name }}(Windows・portable・個人利用専用)。
            keiba-ev-tool-<version>-portable.exe をダウンロードしてダブルクリックで起動します。
          files: packages/app/release/*.exe
