# Issue #161(#21-C)のクラウド版の Worker の設定。
#
# ★公開リポジトリのため、メールアドレス・Access のチーム名・AUD はここにも書かない。
#   これらは Worker の secret(ACCESS_TEAM_NAME / ACCESS_AUD / ACCESS_ALLOWED_EMAIL)として、
#   ユーザーがダッシュボードで登録する。secret は wrangler deploy で消えない
#   (vars にするとダッシュボードの値は次のデプロイで上書きされる)。
#   したがって [vars] も `secrets.required` も置かない(未設定なら Worker が全リクエストに 403 を返す)。
name = "keiba-cloud"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# workers.dev に出す(Cloudflare Access を workers.dev に掛けるため)。独自ドメイン・routes は使わない。
workers_dev = true
# Version URL / Preview URL は無効にする(Access の掛け忘れ以前に、入口を増やさない)。
preview_urls = false

[observability]
enabled = true

# SQLite バックエンドの Durable Object(Free プランで使えるのは SQLite バックエンドだけ)。
# #162 で netkeiba への取得と間隔制御に使う予定の雛形。クラス名は migration に固定されるため、変えるときは migration が要る。
[[durable_objects.bindings]]
name = "NETKEIBA_GATE"
class_name = "NetkeibaGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NetkeibaGate"]
